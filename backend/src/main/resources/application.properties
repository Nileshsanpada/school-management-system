# Server
server.port=8080

# Database (Spring Boot automatically binds SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/school_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:nilesh321}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Flyway (Managed by Hibernate ddl-auto and DataInitializer)
spring.flyway.enabled=false

# JWT
jwt.secret=${JWT_SECRET:mySecretKeyForSchoolManagementSystemThatIsLongEnoughForHS256Algorithm123}
jwt.expiration=86400000

# Attendance
attendance.minimum-percentage=75

# Logging
logging.level.com.schoolmanagement=INFO
logging.level.org.springframework.security=WARN