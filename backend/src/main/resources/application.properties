# Server
server.port=8080

# Database (Defaults to zero-config in-memory DB; automatically connects to Aiven MySQL when DB_URL or SPRING_DATASOURCE_URL is provided)
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:h2:mem:school_management;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:sa}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}

# HikariCP Pool Settings (Optimized for Aiven Cloud MySQL & H2)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=false

# JWT
jwt.secret=${JWT_SECRET:mySecretKeyForSchoolManagementSystemThatIsLongEnoughForHS256Algorithm123}
jwt.expiration=86400000

# Attendance
attendance.minimum-percentage=75

# Logging
logging.level.com.schoolmanagement=INFO
logging.level.org.springframework.security=WARN