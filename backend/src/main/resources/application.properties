# Server
server.port=8080

# Database (Defaults to zero-config in-memory DB; automatically switches to MySQL when DB_URL or SPRING_DATASOURCE_URL is provided)
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:h2:mem:school_management;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:sa}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# Flyway (Managed by Hibernate ddl-auto and DataInitializer)
spring.flyway.enabled=false

# JWT
jwt.secret=${JWT_SECRET:mySecretKeyForSchoolManagementSystemThatIsLongEnoughForHS256Algorithm123}
jwt.expiration=86400000

# Attendance
attendance.minimum-percentage=75

# Spring Mail (Gmail SMTP / Custom SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:educore.notifications@gmail.com}
spring.mail.password=${MAIL_PASSWORD:defaultPassword}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Logging
logging.level.com.schoolmanagement=INFO
logging.level.org.springframework.security=WARN