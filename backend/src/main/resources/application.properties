# Server
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/school_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:nilesh321}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
jwt.secret=${JWT_SECRET:mySecretKeyForSchoolManagementSystemThatIsLongEnoughForHS256Algorithm123}
jwt.expiration=86400000

# Attendance
attendance.minimum-percentage=75

# Logging
logging.level.com.schoolmanagement=INFO
logging.level.org.springframework.security=WARN